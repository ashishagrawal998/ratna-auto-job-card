<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Workshop – JobCardBook</title>
<meta name="theme-color" content="#b5121b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--red:#b5121b;--red-d:#8e0e15;--ink:#1d1d1f;--mut:#6b6b70;--line:#e4e4e7;--bg:#f5f5f4;--card:#fff;--ok:#1f7a3f;--warn:#b26b00}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans Devanagari",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  header{background:var(--red);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
  header h1{font-size:18px;margin:0;font-weight:700}
  header small{opacity:.85;font-size:12px;display:block}
  .lang{margin-left:auto;display:flex;background:rgba(255,255,255,.18);border-radius:20px;padding:3px;flex-shrink:0}
  .lang button{border:0;background:none;color:#fff;font:inherit;font-size:13px;padding:5px 11px;border-radius:16px;cursor:pointer}
  .lang button.on{background:#fff;color:var(--red);font-weight:600}
  nav{display:flex;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
  nav button{flex:1;border:0;background:none;padding:11px 8px;font:inherit;font-size:14px;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  nav button.on{color:var(--red);border-bottom-color:var(--red);font-weight:600}
  main{max-width:860px;margin:0 auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  h2{font-size:16px;margin:0 0 10px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;cursor:pointer}
  .stat b{display:block;font-size:24px;color:var(--red)}
  .stat span{font-size:12px;color:var(--mut)}
  input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid #cfcfd4;border-radius:8px;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--red);border-color:transparent}
  label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
  label.chk{display:flex;align-items:center;gap:6px;color:var(--ink);margin:0}
  label.chk input{width:auto}
  .row{display:flex;gap:8px;align-items:flex-end}
  .row>*{flex:1}
  .btn{border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--red);color:#fff}
  .btn:hover{background:var(--red-d)}
  .btn.ghost{background:#fff;color:var(--red);border:1px solid var(--red)}
  .btn.gray{background:#ececee;color:var(--ink)}
  .btn.ok{background:var(--ok)}
  .btn.sm{padding:6px 10px;font-size:13px}
  .btn.block{width:100%}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid #cfcfd4;background:#fff;border-radius:18px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
  .chip.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
  .list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .list-item:first-child{border-top:0}
  .clickable{cursor:pointer}
  .clickable:hover{background:#fafafa}
  .mut{color:var(--mut);font-size:13px}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:#eee;white-space:nowrap}
  .tag.open{background:#fff1d6;color:var(--warn)}
  .tag.closed{background:#dcf2e3;color:var(--ok)}
  .tag.due{background:#fde2e3;color:var(--red)}
  .tag.type{background:#eef0ff;color:#3b3f9c}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:12px;color:var(--mut);font-weight:600}
  td.num,th.num{text-align:right;white-space:nowrap}
  .dd{position:relative}
  .dd-list{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.1);max-height:280px;overflow:auto;z-index:10}
  .dd-list div{padding:9px 10px;cursor:pointer;border-top:1px solid #f0f0f0}
  .dd-list div:hover,.dd-list div.hi{background:#fff4f4}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
  .total{font-size:18px;font-weight:700;text-align:right;margin-top:8px}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .modal{background:#fff;width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:16px;max-height:92vh;overflow:auto}
  @media(min-width:600px){.modal-bg{align-items:center}.modal{border-radius:14px}}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:30}
  .slip{background:#fff;border:1px solid #999;padding:16px;font-size:13px}
  .slip .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #333;padding-bottom:8px;margin-bottom:8px}
  .slip .hd h3{margin:0;font-size:22px}
  .slip table td,.slip table th{border:1px solid #bbb;padding:5px}
  .slip .sec{background:#f1f1f1;font-weight:700;text-align:center;padding:4px;border:1px solid #bbb;border-bottom:0;margin-top:10px}
  .empty{color:var(--mut);text-align:center;padding:16px}
  .back{background:none;border:0;color:var(--red);font:inherit;font-weight:600;cursor:pointer;padding:0;margin-bottom:10px}
  .note{background:#fffbea;border:1px solid #f1e3a6;border-radius:8px;padding:8px 10px;font-size:13px;color:#6b5a00;margin-bottom:12px}
  @media print{header,nav,.noprint{display:none!important}main{padding:0;max-width:none}.slip{border:0}body{background:#fff}}
</style>
</head>

  <div class="lang"><button data-l="en">English</button><button data-l="ne">नेपाली</button></div>

<div class="noprint" style="text-align:center;padding:10px 0 24px"><button class="btn gray sm" id="reset-btn" onclick="resetDemo()"></button></div>

for(let h=2500;h<=20000;h+=300)SLOTS.push([h+"HRS",h]);
const SLOT_H=Object.fromEntries(SLOTS);
const nextSlot=h=>SLOTS.find(s=>s[1]>h)||SLOTS[SLOTS.length-1];

// =====================================================================
// Dates & helpers
// =====================================================================
const DAY=86400000;
const iso=d=>new Date(d).toISOString();
const ymd=d=>new Date(d).toISOString().slice(0,10);
const addDays=(d,n)=>new Date(new Date(d).getTime()+n*DAY);
function rateOf(tr){ // average hours per day
  if(!tr.lastHours||!tr.doi||!tr.lastDate)return null;
  const days=(new Date(tr.lastDate)-new Date(tr.doi))/DAY;return days>20?tr.lastHours/days:null;
}
function planNext(tr){ // sets nextSlot / nextDue from last service
  const ns=nextSlot(Math.max(tr.lastHours||0,tr.lastSlotHours||0));
  const r=rateOf(tr);
  let days=r&&r>0.2?Math.round((ns[1]-Math.max(tr.lastHours||0,tr.lastSlotHours||0))/r):90;
  days=Math.min(Math.max(days,30),365);
  tr.nextSlot=ns[0];tr.nextDue=iso(addDays(tr.lastDate,days));
}

function seed(){
  let x=7;const rnd=()=>((x=(x*16807)%2147483647)/2147483647);
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const first=["Ram","Shyam","Hari","Sita Ram","Bindeshwar","Rajendra","Mahesh","Suresh","Dinesh","Ramesh","Umesh","Kishun","Lalbabu","Shiv Narayan","Rambabu","Bijay","Sunil","Anil","Jitendra","Mohan","Ganesh","Upendra","Deepak","Bhola","Raj Kumar","Md Ishrail","Abdul"];
  const last=["Yadav","Sah","Mahato","Mandal","Chaudhary","Singh","Kamat","Sada","Thakur","Shah","Paswan","Ray","Gupta","Mishra","Ansari"];
  const places=[["Lahan-5","Siraha"],["Mirchaiya-3","Siraha"],["Golbazar-7","Siraha"],["Siraha-2","Siraha"],["Bastipur-1","Siraha"],["Dhangadhimai-4","Siraha"],["Kalyanpur-6","Siraha"],["Bhardaha-1","Saptari"],["Rajbiraj-9","Saptari"],["Kanchanrup-4","Saptari"],["Hanumannagar-2","Saptari"],["Bodebarsain-5","Saptari"],["Katari-3","Udayapur"],["Mithila-1","Dhanusha"]];
  const mw=[["MF 7250 DI",14],["MF 7250 Power Up",4],["MF 7250 NS",3],["MF 7250 PS",3],["MF 1035 DI",2],["MF 8055 MagnaTrak",2],["MF 9000 DI",1],["MF 9500",1]];
  const pickModel=()=>{let n=rnd()*30;for(const[m,w]of mw){if((n-=w)<0)return m}return "MF 7250 DI"};
  const S={customers:[],tractors:[],history:[],jobs:[],mechanics:["Rambabu Yadav","Suresh Mahato","Dinesh Sah","Manoj Chaudhary"],nextJob:3,nextId:100};
  const now=Date.now();
  for(let i=1;i<=32;i++){
    const [addr,dist]=pick(places);
    S.customers.push({id:i,name:pick(first)+" "+pick(last),phone:"98"+String(Math.floor(10000000+rnd()*89999999)),address:addr,district:dist});
    const ageDays=Math.floor(60+rnd()*1900), rate=2.2+rnd()*2.6;
    const doi=now-ageDays*DAY;
    const tr={id:i,customerId:i,model:pickModel(),chassis:"MEA0B25DCT"+String(2600000+Math.floor(rnd()*99999)),engine:"S325"+pick(["F","R","N"])+String(10000+Math.floor(rnd()*89999)),
      reg:rnd()<.8?`KO 1 TA ${1000+Math.floor(rnd()*8999)}`:"",doi:iso(doi),lastDate:null,lastHours:null,lastSlotHours:0};
    // services done so far (stop before "today" by a random lag so some are due)
    const lag=Math.floor(rnd()*130)-95;
    for(const [slot,h] of SLOTS){
      const d=doi+(h/rate)*DAY+(rnd()*8-4)*DAY;
      if(d>now-lag*DAY-20*DAY)break;
      if(rnd()<.12&&h>1000)continue; // skipped some services
      const hrs=Math.round(h+rnd()*40-10);
      S.history.push({tractorId:i,slot,date:iso(d),ws:"WS "+(100+Math.floor(rnd()*900)),hours:hrs});
      tr.lastDate=iso(d);tr.lastHours=hrs;tr.lastSlotHours=h;
    }
    if(tr.lastDate)planNext(tr);else{tr.nextSlot="FS1";tr.nextDue=iso(addDays(doi,35))}
    S.tractors.push(tr);
  }
  // two sample jobs
  const tr2=S.tractors[1],tr4=S.tractors[3];
  const h4=nextSlot(Math.max(tr4.lastHours||0,tr4.lastSlotHours||0));
  S.history.push({tractorId:4,slot:h4[0],date:iso(now-40*DAY),ws:"JC-00001",hours:h4[1]+12});
  tr4.lastDate=iso(now-40*DAY);tr4.lastHours=h4[1]+12;tr4.lastSlotHours=h4[1];planNext(tr4);
  S.jobs.push({id:1,no:"JC-00001",tractorId:4,customerId:4,mechanic:"Suresh Mahato",type:"PAID",hours:String(tr4.lastHours),nextSlot:tr4.nextSlot,nextDue:tr4.nextDue,dateIn:iso(now-40*DAY),dateOut:iso(now-40*DAY+5*3600000),status:"closed",
    problems:"General service",observ:"Air filter dirty",action:"Service done, filters changed",remarks:"",
    parts:[{pn:"2654408",desc:"LUB OIL FILTER WITH ORING",qty:1,rate:471.32,foc:false,at:iso(now-40*DAY)},{pn:"",desc:"Engine oil 15W40 (7 L)",qty:1,rate:5600,foc:false,at:iso(now-40*DAY)}],labour:[{k:1,amount:1500,outside:false}]});
  S.jobs.push({id:2,no:"JC-00002",tractorId:2,customerId:2,mechanic:"Rambabu Yadav",type:"PAID",hours:String((tr2.lastHours||500)+290),dateIn:iso(now-95*60000),status:"open",
    problems:"Brakes weak, general service",observ:"",action:"",remarks:"",
    parts:[{pn:"1200040S01",desc:"TAFE SUPERIOR PLUS GREASE 1KG",qty:1,rate:1477.9,foc:false,at:iso(now-70*60000)}],labour:[]});
  return S;
}

    <table><tr><th>${t("problems")}</th><th>${t("observ")}</th><th>${t("action")}</th></tr>
      <tr><td>${esc(j.problems)||"—"}</td><td>${esc(j.observ)||"—"}</td><td>${esc(j.action)||"—"}</td></tr></table>
    <div class="sec">${t("mat_note")}</div>
    <table>
      <tr><th>#</th><th>${t("part")}</th><th>${t("part_no")}</th><th class="num">${t("qty")}</th><th class="num">${t("amount")}</th></tr>
      ${j.parts.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.desc)}</td><td>${esc(p.pn||"—")}</td><td class="num">${p.qty}</td><td class="num">${p.foc?t("wty"):rs(p.qty*p.rate)}</td></tr>`).join("")||`<tr><td colspan="5">—</td></tr>`}
      ${j.labour.map(l=>`<tr><td></td><td colspan="3">${l.outside?t("outside"):t("labour_h")}: ${esc(lName(l))}</td><td class="num">${rs(l.amount)}</td></tr>`).join("")}
    </table>
    <div class="sec">${t("billing")}</div>
    <table>
      <tr><td>${t("mat_stores")}</td><td class="num">${rs(partsTotal(j))}</td></tr>
      <tr><td>${t("lab_out")}</td><td class="num">${rs(lab+out)}</td></tr>
      <tr><td><b>${t("grand")}</b></td><td class="num"><b>${rs(partsTotal(j)+lab+out)}</b></td></tr>
    </table>
    ${j.remarks?`<p><span class="mut">${t("remarks")}:</span> ${esc(j.remarks)}</p>`:""}
    <p>${t("next_date")}: <b>${t("slot")(j.nextSlot||tr.nextSlot)} · ${fDate(j.nextDue||tr.nextDue)}</b></p>
    <div style="display:flex;justify-content:space-between;margin-top:34px"><span>____________________<br>${t("sign_ws")}</span><span style="text-align:right">____________________<br>${t("sign_cust")}</span></div>
    <p class="mut" style="font-size:11px">${t("not_bill")}</p>
  </div>`;
}

function vReminders(){
  const due=dueList();
  const later=S.tractors.filter(x=>x.nextDue&&daysTo(x.nextDue)>7&&daysTo(x.nextDue)<=30).sort((a,b)=>new Date(a.nextDue)-new Date(b.nextDue));
  const row=tr=>{const c=cust(tr.customerId),d=daysTo(tr.nextDue);
    const msg=t("msg")(c.name,tr.model,t("slot")(tr.nextSlot),d<0,fDate(tr.nextDue));
    return `<div class="list-item">
      <div><b>${esc(c.name)}</b> <span class="tag ${d<0?"due":"open"}">${d<0?t("late")(-d):d===0?t("today"):d===1?t("tomorrow"):t("in_days")(d)}</span>
        <div class="mut">${esc(tr.model)} · ${t("slot")(tr.nextSlot)} · ${fDate(tr.nextDue)}<br>📞 ${esc(c.phone)}</div></div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <a class="btn ok sm" style="text-decoration:none" href="https://wa.me/977${c.phone}?text=${encodeURIComponent(msg)}" target="_blank">WhatsApp</a>
        <button class="btn ghost sm" onclick="go('customer',${tr.id})">${t("open_b")}</button>
      </div></div>`};
  return `<div class="card"><h2>${t("due_h")}</h2><p class="mut">${t("due_note")}</p>
    ${due.length?due.map(row).join(""):`<div class="empty">${t("none_due")}</div>`}</div>
  <div class="card"><h2>${t("upcoming")}</h2>${later.length?later.map(row).join(""):`<div class="empty">—</div>`}</div>`;
}

    <label>${t("phone")}</label><input id="nc-phone" inputmode="tel" value="${/^\d+$/.test(searchQ)?esc(searchQ):""}">
    <label>${t("address")}</label><input id="nc-addr">
    <label>${t("model")}</label><select id="nc-model">${MODELS.map(m=>`<option>${m}</option>`).join("")}</select>
    <div class="row"><div><label>${t("engine")}</label><input id="nc-eng"></div><div><label>${t("chassis")}</label><input id="nc-ch"></div></div>
    <div class="row"><div><label>${t("reg")}</label><input id="nc-reg"></div><div><label>${t("doi")}</label><input id="nc-doi" type="date" value="${ymd(new Date())}"></div></div>

function saveCustomer(){
  const v=k=>$("#nc-"+k).value.trim();
  if(!v("name")||!v("phone")){toast(t("need_np"));return}
  const id=S.nextId++;
  S.customers.push({id,name:v("name"),phone:v("phone"),address:v("addr"),district:""});
  const doi=v("doi")?iso(v("doi")+"T09:00:00"):iso(new Date());
  S.tractors.push({id,customerId:id,model:v("model"),engine:v("eng"),chassis:v("ch"),reg:v("reg"),doi,lastDate:null,lastHours:null,lastSlotHours:0,nextSlot:"FS1",nextDue:iso(addDays(doi,35))});
  save();closeModal();searchQ="";toast(t("cust_added"));go("customer",id);
}
let pickedType="PAID";
function startJob(tid){
  const tr=trac(tid),c=cust(tr.customerId);
  pickedType=tr.nextSlot&&tr.nextSlot.startsWith("FS")?tr.nextSlot:"PAID";
  modal(`<h2>${t("nj_h")}</h2>
    <p class="mut">${esc(c.name)} · ${esc(tr.model)} · ${t("next_srv")}: ${t("slot")(tr.nextSlot)}</p>
    <label>${t("type_job")}</label>
    <div class="chips" id="jt">${JOB_TYPES.map(k=>`<button class="chip ${k===pickedType?"on":""}" onclick="pickType('${k}')">${t("jt")[k]}</button>`).join("")}</div>
    <div id="prfbox" style="display:${pickedType==="WTY"?"block":"none"}"><label>${t("prf")}</label><input id="sj-prf"></div>
    <div class="row"><div><label>${t("mech")}</label><select id="sj-m">${S.mechanics.map(m=>`<option>${esc(m)}</option>`).join("")}</select></div>
    <div><label>${t("hours_req")}</label><input id="sj-h" type="number" placeholder="${tr.lastHours?"> "+tr.lastHours:""}"></div></div>
    <label>${t("problems")}</label><textarea id="sj-c" rows="2" placeholder="${t("compl_ph")}"></textarea>
    <p class="mut">${t("auto_time")} <b>${fDT(new Date())}</b></p>
    <div class="row"><button class="btn gray" onclick="closeModal()">${t("cancel")}</button><button class="btn" onclick="doStartJob(${tid})">${t("start")}</button></div>`);
}
function pickType(k){pickedType=k;document.querySelectorAll("#jt .chip").forEach(b=>b.classList.toggle("on",b.textContent===t("jt")[k]));$("#prfbox").style.display=k==="WTY"?"block":"none"}
function doStartJob(tid){
  const tr=trac(tid),id=S.nextJob++;
  S.jobs.push({id,no:"JC-"+String(id).padStart(5,"0"),tractorId:tid,customerId:tr.customerId,mechanic:$("#sj-m").value,type:pickedType,prf:pickedType==="WTY"?$("#sj-prf").value.trim():"",
    hours:$("#sj-h").value,dateIn:iso(new Date()),status:"open",problems:$("#sj-c").value.trim(),observ:"",action:"",remarks:"",parts:[],labour:[]});
  save();closeModal();toast(t("job_started"));go("job",id);
}

// ---- parts search over the real catalogue ----
let selProd=null,hiIdx=0,psMatches=[];
function psSearch(){
  const q=$("#ps").value.trim().toLowerCase();selProd=null;$("#psel").innerHTML="";psMatches=[];
  if(q.length>=2&&PARTS){
    const words=q.split(/\s+/);
    for(let i=0;i<PIDX.length&&psMatches.length<30;i++){if(words.every(w=>PIDX[i].includes(w)))psMatches.push(i)}
    psMatches.sort((a,b)=>(PARTS[b][0].toLowerCase().startsWith(q))-(PARTS[a][0].toLowerCase().startsWith(q)));
  }
  hiIdx=0;
  $("#psl").innerHTML=psMatches.length?`<div class="dd-list">${psMatches.map((pi,i)=>{const p=PARTS[pi];return `<div class="${i===0?"hi":""}" onmousedown="pickProd(${pi})"><b>${esc(p[1])}</b><br><span class="mut">${esc(p[0])} · MRP ${rs(p[2])}</span></div>`}).join("")}</div>`:"";
}
function psKey(e){
  if(!psMatches.length)return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();hiIdx=(hiIdx+(e.key==="ArrowDown"?1:-1)+psMatches.length)%psMatches.length;document.querySelectorAll(".dd-list div").forEach((d,i)=>d.classList.toggle("hi",i===hiIdx))}
  if(e.key==="Enter"){e.preventDefault();pickProd(psMatches[hiIdx])}
}
function pickProd(pi){
  const p=PARTS[pi];selProd={pn:p[0],desc:p[1],rate:p[2]};psMatches=[];
  $("#ps").value=p[1];$("#psl").innerHTML="";
  $("#psel").innerHTML=`${t("selected")}: <b>${esc(p[1])}</b> · ${esc(p[0])} · MRP ${rs(p[2])}`;
  $("#pq").focus();$("#pq").select();
}
function addPart(jid){
  if(!selProd){toast(t("pick_first"));$("#ps").focus();return}
  const q=Math.max(0.01,parseFloat($("#pq").value)||1);
  job(jid).parts.push({...selProd,qty:q,foc:$("#pfoc").checked,at:iso(new Date())});
  selProd=null;save();render();toast(t("part_added"));$("#ps").focus();
}
function manualItem(jid){
  modal(`<h2>${t("mi_h")}</h2>
    <label>${t("mi_desc")}</label><input id="mi-d">
    <div class="row"><div><label>${t("qty")}</label><input id="mi-q" type="number" step="any" value="1"></div><div><label>${t("rate")}</label><input id="mi-r" type="number" step="any"></div></div>
    <div class="row" style="margin-top:14px"><button class="btn gray" onclick="closeModal()">${t("cancel")}</button><button class="btn" onclick="doManual(${jid})">${t("add")}</button></div>`);
  $("#mi-d").focus();
}
function doManual(jid){
  const d=$("#mi-d").value.trim();if(!d){toast(t("enter_desc"));return}
  job(jid).parts.push({pn:"",desc:d,qty:parseFloat($("#mi-q").value)||1,rate:parseFloat($("#mi-r").value)||0,foc:false,at:iso(new Date())});
  save();closeModal();render();toast(t("part_added"));
}
function delPart(jid,i){job(jid).parts.splice(i,1);save();render()}
function addLabourPreset(jid,i){job(jid).labour.push({k:i,amount:PRESET_AMT[i],outside:false});save();render()}
function addLabour(jid){const d=$("#ld").value.trim(),a=Number($("#la").value);if(!d){toast(t("enter_desc"));return}job(jid).labour.push({desc:d,amount:a||0,outside:$("#lout").checked});save();render()}
function delLabour(jid,i){job(jid).labour.splice(i,1);save();render()}

function closeJobDlg(jid){
  const j=job(jid),tr=trac(j.tractorId);
  if(!j.parts.length&&!j.labour.length){toast(t("nothing_added"));return}
  // preview of the next service from these hours
  const sim={...tr,lastDate:iso(new Date()),lastHours:parseInt(j.hours)||tr.lastHours,lastSlotHours:SLOT_H[j.type]||tr.lastSlotHours||0};planNext(sim);
  modal(`<h2>${t("close_q")} ${j.no}</h2>
    <p>${j.parts.length} ${t("parts_n")} · ${t("total")} <b>${rs(partsTotal(j)+labourTotal(j))}</b></p>
    <label>${t("observ")}</label><textarea id="cj-o" rows="2"></textarea>
    <label>${t("action")}</label><textarea id="cj-a" rows="2"></textarea>
    <label>${t("remarks")}</label><input id="cj-r">
    <label>${t("next_auto")} – ${t("slot")(sim.nextSlot)}</label><input id="cj-next" type="date" value="${ymd(sim.nextDue)}">
    <div class="row" style="margin-top:14px"><button class="btn gray" onclick="closeModal()">${t("cancel")}</button><button class="btn ok" onclick="doCloseJob(${jid},'${sim.nextSlot}')">${t("close_b")}</button></div>`);
}
function doCloseJob(jid,slot){
  const j=job(jid),tr=trac(j.tractorId);
  j.observ=$("#cj-o").value.trim();j.action=$("#cj-a").value.trim();j.remarks=$("#cj-r").value.trim();
  j.status="closed";j.dateOut=iso(new Date());
  const h=parseInt(j.hours);
  S.history.push({tractorId:tr.id,slot:SLOT_H[j.type]?j.type:(tr.nextSlot||"PAID1"),date:j.dateOut,ws:j.no,hours:h||""});
  tr.lastDate=j.dateOut;if(h)tr.lastHours=h;tr.lastSlotHours=Math.max(tr.lastSlotHours||0,SLOT_H[j.type]||SLOT_H[tr.nextSlot]||0);
  tr.nextSlot=slot;const nv=$("#cj-next").value;tr.nextDue=nv?iso(nv+"T09:00:00"):iso(addDays(new Date(),90));j.nextSlot=tr.nextSlot;j.nextDue=tr.nextDue;
  save();closeModal();toast(t("job_closed"));go("slip",jid);
}
function tryPrint(){try{window.print()}catch(e){}}
function copySlip(jid){
  const j=job(jid),c=cust(j.customerId),tr=trac(j.tractorId);
  const txt=[`${t("firm")} – ${t("slip_h")} ${j.no}`,`${t("name")}: ${c.name} (${c.phone})`,`${t("tractor")}: ${tr.model} | ${t("engine")}: ${tr.engine} | ${t("chassis")}: ${tr.chassis}`,
    `${t("type_job")}: ${t("jt")[j.type]} | ${t("hours_run")}: ${j.hours||"-"} | ${t("mech")}: ${j.mechanic}`,`${t("date_in")}: ${fDT(j.dateIn)} | ${t("date_out")}: ${fDT(j.dateOut)}`,"",
    ...j.parts.map((p,i)=>`${i+1}. ${p.desc} [${p.pn||"-"}] x${p.qty} @ ${p.rate} = ${p.foc?t("wty"):p.qty*p.rate}`),
    ...j.labour.map(l=>`${t("labour_h")}: ${lName(l)} = ${l.amount}`),"",`${t("grand")}: ${partsTotal(j)+labourTotal(j)}`,`${t("next_date")}: ${t("slot")(j.nextSlot||tr.nextSlot)} – ${fDate(j.nextDue||tr.nextDue)}`].join("\n");
  navigator.clipboard.writeText(txt).then(()=>toast(t("copied"))).catch(()=>toast(t("copy_fail")));
}
