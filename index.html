<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ratna Auto – Job Card</title>
<meta name="theme-color" content="#c8102e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--red:#b5121b;--red-d:#8e0e15;--ink:#1d1d1f;--mut:#6b6b70;--line:#e4e4e7;--bg:#f5f5f4;--card:#fff;--ok:#1f7a3f;--warn:#b26b00}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans Devanagari",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  header{background:var(--red);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
  header h1{font-size:18px;margin:0;font-weight:700}
  header small{opacity:.85;font-size:12px;display:block}
  .lang{margin-left:auto;display:flex;background:rgba(255,255,255,.18);border-radius:20px;padding:3px;flex-shrink:0}
  .lang button{border:0;background:none;color:#fff;font:inherit;font-size:13px;padding:5px 11px;border-radius:16px;cursor:pointer}
  .lang button.on{background:#fff;color:var(--red);font-weight:600}
  nav{display:flex;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
  nav button{flex:1;border:0;background:none;padding:11px 8px;font:inherit;font-size:14px;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  nav button.on{color:var(--red);border-bottom-color:var(--red);font-weight:600}
  main{max-width:860px;margin:0 auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  h2{font-size:16px;margin:0 0 10px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;cursor:pointer}
  .stat b{display:block;font-size:24px;color:var(--red)}
  .stat span{font-size:12px;color:var(--mut)}
  input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid #cfcfd4;border-radius:8px;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--red);border-color:transparent}
  label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
  label.chk{display:flex;align-items:center;gap:6px;color:var(--ink);margin:0}
  label.chk input{width:auto}
  .row{display:flex;gap:8px;align-items:flex-end}
  .row>*{flex:1}
  .btn{border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--red);color:#fff}
  .btn:hover{background:var(--red-d)}
  .btn.ghost{background:#fff;color:var(--red);border:1px solid var(--red)}
  .btn.gray{background:#ececee;color:var(--ink)}
  .btn.ok{background:var(--ok)}
  .btn.sm{padding:6px 10px;font-size:13px}
  .btn.block{width:100%}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid #cfcfd4;background:#fff;border-radius:18px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
  .chip.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
  .list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .list-item:first-child{border-top:0}
  .clickable{cursor:pointer}
  .clickable:hover{background:#fafafa}
  .mut{color:var(--mut);font-size:13px}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:#eee;white-space:nowrap}
  .tag.open{background:#fff1d6;color:var(--warn)}
  .tag.closed{background:#dcf2e3;color:var(--ok)}
  .tag.due{background:#fde2e3;color:var(--red)}
  .tag.type{background:#eef0ff;color:#3b3f9c}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:12px;color:var(--mut);font-weight:600}
  td.num,th.num{text-align:right;white-space:nowrap}
  .dd{position:relative}
  .dd-list{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.1);max-height:280px;overflow:auto;z-index:10}
  .dd-list div{padding:9px 10px;cursor:pointer;border-top:1px solid #f0f0f0}
  .dd-list div:hover,.dd-list div.hi{background:#fff4f4}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
  .total{font-size:18px;font-weight:700;text-align:right;margin-top:8px}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .modal{background:#fff;width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:16px;max-height:92vh;overflow:auto}
  @media(min-width:600px){.modal-bg{align-items:center}.modal{border-radius:14px}}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:30}
  .slip{background:#fff;border:1px solid #999;padding:16px;font-size:13px}
  .slip .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #333;padding-bottom:8px;margin-bottom:8px}
  .slip .hd h3{margin:0;font-size:22px}
  .slip table td,.slip table th{border:1px solid #bbb;padding:5px}
  .slip .sec{background:#f1f1f1;font-weight:700;text-align:center;padding:4px;border:1px solid #bbb;border-bottom:0;margin-top:10px}
  .empty{color:var(--mut);text-align:center;padding:16px}
  .back{background:none;border:0;color:var(--red);font:inherit;font-weight:600;cursor:pointer;padding:0;margin-bottom:10px}
  .note{background:#fffbea;border:1px solid #f1e3a6;border-radius:8px;padding:8px 10px;font-size:13px;color:#6b5a00;margin-bottom:12px}
  @media print{header,nav,.noprint{display:none!important}main{padding:0;max-width:none}.slip{border:0}body{background:#fff}}

  #bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line);padding:6px 14px;font-size:13px}
  #bar a{color:var(--red)}
  .btn:disabled{opacity:.6;cursor:wait}
  .chip.mech.m0{background:#e3f5e8;border-color:#7cc492;color:#155c2c}
  .chip.mech.m1{background:#fff6d6;border-color:#e6c24f;color:#7a5a00}
  .chip.mech.m2{background:#ffe6d1;border-color:#f0a060;color:#8a3d00}
  .chip.mech.on{outline:3px solid var(--red);outline-offset:1px;font-weight:700}
  td.num a{color:var(--ink);text-decoration:underline dotted}
  .tag.MSTW{background:#fbd3e6;color:#9c1458;font-weight:600}
  .tag.JC{background:#fff1b8;color:#7a5d00;font-weight:600}
  .krow.kMSTW{border-left:5px solid #e0569b;padding-left:8px}
  .krow.kJC{border-left:5px solid #e6b800;padding-left:8px}
  .card.kMSTW{background:#fff0f6;border-color:#f4b6d2}
  .card.kJC{background:#fffbe6;border-color:#f1dc8a}
  .slip.MSTW{background:#ffe3ef}
  .slip.JC{background:#fff7cc}
  .slip.MSTW .sec,.slip.JC .sec{background:rgba(255,255,255,.55)}
  .kpick{display:flex;gap:8px;margin-bottom:4px}
  .kbtn{flex:1;border:2px solid transparent;border-radius:10px;padding:10px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
  .kbtn small{font-size:12px;opacity:.8}
  .kbtn.MSTW{background:#fbd3e6;color:#9c1458}
  .kbtn.JC{background:#fff1b8;color:#7a5d00}
  .kbtn.on{border-color:var(--red);box-shadow:0 0 0 2px rgba(181,18,27,.15)}
  .rtab tr.clickable:hover td{background:#fff4f4}
  .stat:hover{border-color:var(--red)}
  @media print{.slip.MSTW,.slip.JC{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

  /* ---- UI refresh (Nov 2026) ---- */
  :root{--red:#c8102e;--red-d:#9e0c24;--bg:#f3f2f0;--line:#e7e5e2}
  body{font-size:15.5px;-webkit-tap-highlight-color:transparent}
  header{background:linear-gradient(135deg,#d4142f 0%,#a50d22 100%);padding:12px 16px;box-shadow:0 2px 10px rgba(120,0,15,.25)}
  .logo{width:42px;height:42px;border-radius:12px;background:#fff;color:var(--red);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;letter-spacing:.5px;flex-shrink:0;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.2)}
  .logo img{width:100%;height:100%;object-fit:contain}
  .ttl{min-width:0}
  header h1{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav{gap:2px;padding:0 6px}
  nav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 6px;font-size:13px}
  nav button i{font-style:normal;font-size:19px;line-height:1.1}
  @media(max-width:700px){
    nav{position:fixed;bottom:0;left:0;right:0;z-index:15;border-top:1px solid var(--line);border-bottom:0;box-shadow:0 -2px 12px rgba(0,0,0,.07);padding:0 0 env(safe-area-inset-bottom);overflow:visible}
    nav button{padding:7px 2px 6px;font-size:11px;border-bottom:0;border-top:3px solid transparent;min-width:0}
    nav button.on{border-top-color:var(--red);background:#fff5f6}
    body.inapp main{padding-bottom:86px}
    .toast{bottom:84px}
  }
  .card{border-radius:14px;border-color:#ebe9e6;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:16px}
  h2{font-size:17px}
  input,select,textarea{padding:12px;border-radius:10px;min-height:46px;font-size:16px}
  textarea{min-height:70px}
  .btn{border-radius:12px;padding:12px 18px;min-height:46px;font-size:15.5px;box-shadow:0 1px 2px rgba(0,0,0,.12);transition:transform .08s,background .15s}
  .btn:active{transform:scale(.97)}
  .btn.sm{min-height:34px;padding:7px 12px;border-radius:10px;font-size:13.5px;box-shadow:none}
  .btn.ghost,.btn.gray{box-shadow:none}
  .btn.ghost{border-width:1.5px}
  .chip{padding:8px 14px;border-radius:20px;font-size:14px;min-height:38px}
  .tag{padding:3px 9px}
  .list-item{padding:12px 4px}
  .list-item.clickable{border-radius:10px}
  .back{font-size:16px;padding:6px 0}
  .modal{border-radius:20px 20px 0 0;padding:18px}
  @media(min-width:600px){.modal{border-radius:18px}}
  #bar{padding:7px 14px}
  /* home */
  .hello{display:flex;justify-content:space-between;align-items:baseline;margin:2px 2px 12px;gap:8px}
  .hello b{font-size:18px}
  .stats{gap:10px}
  .stat{border-radius:14px;padding:14px 8px 12px;border:0;box-shadow:0 1px 3px rgba(0,0,0,.07);position:relative;overflow:hidden;transition:transform .08s}
  .stat:active{transform:scale(.97)}
  .stat:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c,var(--red))}
  .stat .ic{font-size:22px;display:block;margin-bottom:2px}
  .stat b{font-size:32px;line-height:1.1;color:var(--c,var(--red))}
  .stat span{font-size:12.5px;font-weight:600;color:#55555a}
  .stat em{display:block;font-style:normal;font-size:11.5px;color:var(--mut);margin-top:3px}
  .stat.s1{--c:#c8102e}.stat.s2{--c:#1f7a3f}.stat.s3{--c:#b26b00}
  .stat.s3.hot{background:#fff6ea}
  .bigbtn{display:flex;align-items:center;justify-content:center;gap:8px;font-size:16.5px;min-height:54px}
</style>
</head>
<body>
<header>
  <div class="logo" id="h-logo">RA</div>
  <div class="ttl"><h1 id="h-title">Ratna Auto – Job Card</h1><small id="h-sub"></small></div>
  <div class="lang"><button data-l="en">English</button><button data-l="ne">नेपाली</button></div>
</header>
<nav id="nav" style="display:none"></nav>
<div id="bar" class="noprint" style="display:none"></div>
<main id="app"></main>
<div id="modal"></div>
<script>if(location.hostname.endsWith("vercel.app"))location.replace("https://ratna-auto-job-card.pages.dev"+location.pathname+location.search+location.hash)</script>
<script src="app.js"></script>
</body>
</html>
